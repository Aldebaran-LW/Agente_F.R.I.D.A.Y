# Template HTTP — certbot --nginx adiciona SSL automaticamente
# install-nginx-ec2-hooks.sh substitui __EC2_HOOKS_DOMAIN__

upstream openclaw_forge {
    server 127.0.0.1:8787;
    keepalive 8;
}

upstream openclaw_orchestrate {
    server 127.0.0.1:8790;
    keepalive 4;
}

server {
    listen 80;
    server_name __EC2_HOOKS_DOMAIN__;

    client_max_body_size 1m;

    location /orchestrate/ {
        proxy_pass http://openclaw_orchestrate/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /forge-events/ {
        proxy_pass http://openclaw_forge/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
    }

    location /health {
        default_type application/json;
        return 200 '{"ok":true,"nginx":"openclaw-ec2-hooks"}';
    }
}
