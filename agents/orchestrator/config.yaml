# Jarvis / orquestrador — ver agents/orchestrator/AGENTS.md
id: orchestrator
name: Jarvis
role: Orquestrador (Telegram, aprovacoes, delegacao)

llm:
  provider: deepseek
  env_key: DEEPSEEK_API_KEY
  model: deepseek-v4-flash
  fallbacks:
    - openrouter/nvidia/nemotron-3-super-120b-a12b:free
    - ollama/llama3.2:1b

llm_policy:
  order: [scripts, ollama, deepseek_direct, openrouter_free, paid_explicit_only]

skills:
  - politica-seguranca
  - openclaw-jarvis
  - github-aldebaran
  - deploy-monitor
  - vercel-status

deploy:
  mode: aws_ec2
  gateway: vercel
  webhook_path: /task

secrets:
  gateway: [OPENCLAW_GATEWAY_BASE_URL, OPENCLAW_AUTOMATION_TOKEN]
  optional: [DEEPSEEK_API_KEY, OPENROUTER_API_KEY]
