# Jarvis / orquestrador — ver agents/orchestrator/AGENTS.md
id: orchestrator
name: Jarvis
role: Orquestrador (Telegram, aprovacoes, delegacao)

# Telegram: Groq (128k) + fallbacks cloud; operacional via skill openclaw-jarvis
llm:
  provider: groq
  model: llama-3.3-70b-versatile
  fallbacks:
    - infron/deepseek/deepseek-v3.2
    - deepseek/deepseek-v4-flash
    - huggingface/Qwen/Qwen2.5-7B-Instruct:fastest

llm_policy:
  order: [scripts, groq, infron, deepseek_direct, hf_inference, paid_explicit_only]
  simple: groq/llama-3.3-70b-versatile
  complex: groq/llama-3.3-70b-versatile
  complex_fallback: infron/deepseek/deepseek-v3.2

skills:
  - politica-seguranca
  - openclaw-jarvis

deploy:
  mode: aws_ec2
  gateway: vercel
  webhook_path: /task

secrets:
  gateway: [OPENCLAW_GATEWAY_BASE_URL, OPENCLAW_AUTOMATION_TOKEN]
  optional: [GROQ_API_KEY, DEEPSEEK_API_KEY, HF_TOKEN, HF_INFERENCE_MODEL, INFRON_API_KEY]
