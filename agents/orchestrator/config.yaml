# Jarvis / orquestrador — ver agents/orchestrator/AGENTS.md
id: orchestrator
name: Jarvis
role: Cérebro (Telegram, aprovacoes, delegacao)

# Telegram: HF Router (32k) + fallbacks cloud; operacional via skill openclaw-jarvis
# Ollama smollm2 NÃO cabe o prompt Jarvis — inferencia local fica no HF Space (friday-prod)
llm:
  provider: huggingface
  model: Qwen/Qwen2.5-7B-Instruct:fastest
  fallbacks:
    - groq/llama-3.3-70b-versatile
    - infron/deepseek/deepseek-v3.2
    - deepseek/deepseek-v4-flash

llm_policy:
  order: [scripts, hf_inference, groq, infron, deepseek_direct, paid_explicit_only]
  simple: huggingface/Qwen/Qwen2.5-7B-Instruct:fastest
  complex: huggingface/Qwen/Qwen2.5-7B-Instruct:fastest
  complex_fallback: groq/llama-3.3-70b-versatile

skills:
  - politica-seguranca
  - openclaw-jarvis

deploy:
  mode: aws_ec2
  gateway: vercel
  webhook_path: /task

secrets:
  gateway: [OPENCLAW_GATEWAY_BASE_URL, OPENCLAW_AUTOMATION_TOKEN]
  optional: [HF_TOKEN, HF_INFERENCE_MODEL, GROQ_API_KEY, DEEPSEEK_API_KEY, INFRON_API_KEY]
