# Jarvis / orquestrador — ver agents/orchestrator/AGENTS.md
id: orchestrator
name: Jarvis
role: Orquestrador (Telegram, aprovacoes, delegacao)

# Primary: OpenRouter FREE (DeepSeek directo so quando houver creditos)
llm:
  provider: openrouter
  env_key: OPENROUTER_API_KEY
  model: deepseek/deepseek-v4-flash:free
  fallbacks:
    - minimax/minimax-m2.5:free
    - openai/gpt-oss-20b:free
    - google/gemma-4-26b-a4b-it:free

llm_policy:
  order: [scripts, ollama, openrouter_free, deepseek_direct, paid_explicit_only]

skills:
  - politica-seguranca
  - openclaw-jarvis
  - github-aldebaran
  - deploy-monitor
  - vercel-status

deploy:
  mode: aws_ec2
  gateway: vercel
  webhook_path: /task

secrets:
  gateway: [OPENCLAW_GATEWAY_BASE_URL, OPENCLAW_AUTOMATION_TOKEN]
  optional: [OPENROUTER_API_KEY, DEEPSEEK_API_KEY]
