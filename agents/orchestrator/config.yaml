# Jarvis / orquestrador — ver agents/orchestrator/AGENTS.md
id: orchestrator
name: Jarvis
role: Orquestrador (Telegram, aprovacoes, delegacao)

# Telegram: Ollama (simples) + DeepSeek directo (complexo) + gateway (operacional)
llm:
  provider: ollama
  model: smollm2:360m
  fallbacks:
    - deepseek/deepseek-v4-flash

llm_policy:
  order: [scripts, ollama, deepseek_direct, paid_explicit_only]
  simple: ollama/smollm2:360m
  complex: deepseek/deepseek-v4-flash

skills:
  - politica-seguranca
  - openclaw-jarvis
  - github-aldebaran
  - deploy-monitor
  - vercel-status

deploy:
  mode: aws_ec2
  gateway: vercel
  webhook_path: /task

secrets:
  gateway: [OPENCLAW_GATEWAY_BASE_URL, OPENCLAW_AUTOMATION_TOKEN]
  optional: [DEEPSEEK_API_KEY]
