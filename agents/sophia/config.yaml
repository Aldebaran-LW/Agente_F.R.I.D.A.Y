id: sophia
name: Sophia
role: Pesquisa de ferramentas, tendencias e oportunidades (inovacao)

llm:
  provider: ollama
  model: smollm2:360m
  fallbacks: []

skills:
  - politica-seguranca
  - innovation-research

secrets:
  optional: [GOOGLE_API_KEY, HF_TOKEN]

deploy:
  mode: hf_space
  hf_space: Aldebaran-LW/friday-prod
  hf_path: /run/sophia
  dataset: Aldebaran-LW/openclaw-backup
  promote_to: aws_ec2
  schedule: "0 */6 * * *"

pipeline:
  output_schema: agents/_shared/schemas/pesquisa-entry.yaml
  sources:
    - web
    - huggingface_hub
    - github_trending
    - papers_with_code
    - product_hunt
    - reddit
