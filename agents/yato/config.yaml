id: yato
name: Yato
role: Pesquisa de Mercado / Marketing Digital

llm:
  provider: huggingface
  model: Qwen/Qwen2.5-7B-Instruct:fastest
  fallbacks:
    - groq/llama-3.3-70b-versatile
  # MIGRADO: ollama/smollm2:360m → HF (Ollama não existe no HF Space)

skills:
  - politica-seguranca
  - innovation-market

secrets:
  optional: [GOOGLE_API_KEY, HF_TOKEN]

deploy:
  mode: hf_space
  hf_space: Aldebaran-LW/friday-prod
  hf_path: /run/yato
  dataset: Aldebaran-LW/openclaw-backup

pipeline:
  output_schema: agents/_shared/schemas/pesquisa-entry.yaml
  dataset_folder: market/
  sources:
    - product_hunt
    - google_trends
    - g2
    - crunchbase
