id: macofel
name: Macofel
role: Catalogo e-commerce (unico cerebro com Mongo/API Macofel)

llm:
  provider: ollama
  model: smollm2:360m
  fallbacks: []

skills:
  - politica-seguranca
  - macofel-status
  - macofel-images-sync

deploy:
  mode: aws_ec2
  gateway: vercel
  api: macofel-aws

secrets:
  local_or_gateway:
    - OPENCLAW_GATEWAY_BASE_URL
    - OPENCLAW_AUTOMATION_TOKEN
    - MONGODB_URI
    - MACOFEL_API_BASE
    - MACOFEL_CATALOG_SECRET
