id: macofel
name: Macofel
role: Catalogo e-commerce (unico cerebro com Mongo/API Macofel)

llm:
  provider: openrouter
  model: google/gemma-4-26b-a4b-it:free
  fallbacks: []

skills:
  - politica-seguranca
  - macofel-status
  - macofel-images-sync

deploy:
  mode: hf_space
  hf_space: Aldebaran-LW/macofel-agent
  gateway: vercel
  api: macofel-aws
  note: "Instancia separada do OpenClaw core — nao partilha Space com inovacao"

secrets:
  local_or_gateway:
    - OPENCLAW_GATEWAY_BASE_URL
    - OPENCLAW_AUTOMATION_TOKEN
    - MONGODB_URI
    - MACOFEL_API_BASE
    - MACOFEL_CATALOG_SECRET
