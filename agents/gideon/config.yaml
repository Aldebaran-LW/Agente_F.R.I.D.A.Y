id: gideon
name: Gideon
role: Predição e cenários futuros (após Senku)

llm:
  provider: mistral
  env_key: MISTRAL_API_KEY
  model: mistral-small-latest
  fallbacks: []

skills:
  - politica-seguranca
  - innovation-forecast

secrets:
  optional: [MISTRAL_API_KEY]

deploy:
  mode: hf_space
  hf_space: Aldebaran-LW/friday-prod
  hf_path: /run/gideon

pipeline:
  dataset_folder: predictions/
  output_schema: agents/_shared/schemas/pesquisa-entry.yaml
  weights:
    custo_implementacao: 0.3
    retorno_lucrativo: 0.35
    compatibilidade_stack: 0.2
    manutenibilidade: 0.15
  threshold: 70
