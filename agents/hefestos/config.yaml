id: hefestos
name: Hefestos
role: Construtor (Em Geral)

llm:
  provider: kilo
  model: kilo-auto/free
  fallbacks: []

skills:
  - politica-seguranca
  - innovation-build

secrets:
  gateway: [OPENCLAW_GATEWAY_BASE_URL, OPENCLAW_AUTOMATION_TOKEN]
  optional: [GITHUB_TOKEN]

deploy:
  mode: hf_space
  hf_space: Aldebaran-LW/friday-prod
  hf_path: /run/hefestos
  promote_to: aws_ec2

pipeline:
  min_viabilidade_score: 70
  subroles:
    - integrador_skills
    - otimizador_sistemas
    - gerador_documentacao
