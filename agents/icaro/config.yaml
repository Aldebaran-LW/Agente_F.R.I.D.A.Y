id: icaro
name: Ícaro
role: Testes, regressao e validacao pos-Hefestos

llm:
  provider: openrouter
  env_key: OPENROUTER_API_KEY
  model: minimax/minimax-m2.5:free
  fallbacks:
    - poolside/laguna-xs.2:free
    - deepseek/deepseek-v4-flash:free

skills:
  - politica-seguranca
  - innovation-test

secrets:
  optional: [OPENROUTER_API_KEY]

pipeline:
  triggers: [hefestos_complete]
  commands:
    - node scripts/validate-agent-config.mjs
    - powershell scripts/run-tests.ps1
