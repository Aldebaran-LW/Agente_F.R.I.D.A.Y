name = "openclaw-llm-router"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = true

[env.staging]
name = "openclaw-llm-router-staging"
workers_dev = true

[env.staging.ai]
binding = "AI"

[env.production]
name = "openclaw-llm-router"
workers_dev = false
route = "api.openclaw.lwdigitalforge.com/llm/*"

[env.production.ai]
binding = "AI"
