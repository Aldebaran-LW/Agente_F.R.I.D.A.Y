name = "openclaw-gateway"
workers_dev = true
main = "gateway/worker.mjs"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

[build]
cwd = "gateway"
command = "npm install"

[env.staging]
vars = { ENVIRONMENT = "staging" }

[env.production]
vars = { ENVIRONMENT = "production" }
