name: Deploy OpenClaw Workers

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Deploy Workers to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish Router
        run: npx wrangler deploy --env staging
        working-directory: workers/router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish Macofel
        run: npx wrangler deploy --env staging
        working-directory: workers/macofel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish Jarvis
        run: npx wrangler deploy --env staging
        working-directory: workers/jarvis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish Heimdall
        run: npx wrangler deploy --env staging
        working-directory: workers/heimdall
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish Innovation
        run: npx wrangler deploy --env staging
        working-directory: workers/innovation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Test Router
        run: |
          sleep 10
          curl -f https://openclaw-router-staging.lwdigitalforge.workers.dev/health || echo "Aguardando propagacao..."

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          MSG="$([ "$STATUS" = "success" ] && echo '✅ Workers OpenClaw deploy OK' || echo '❌ Workers deploy FALHOU')"
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}\", \"text\": \"$MSG\"}"
