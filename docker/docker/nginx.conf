server {
    listen 8080;
    server_name _;

    client_max_body_size 50M;

    # MeiliSearch - Search API
    location /search/ {
        proxy_pass http://meilisearch:7700/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "Bearer openclaw-meili-key-change-me";
    }

    # Khoj - AI Second Brain / RAG
    location /khoj/ {
        proxy_pass http://khoj:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Apprise - Notifications
    location /notify/ {
        proxy_pass http://apprise:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        return 200 '{"ok":true,"services":["meilisearch","khoj","apprise"]}';
        add_header Content-Type application/json;
    }
}
